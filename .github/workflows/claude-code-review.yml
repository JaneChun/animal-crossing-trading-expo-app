name: Claude Code Review

on:
    pull_request:
        branches: [master]
        types: [opened, synchronize, ready_for_review, reopened]

# 같은 PR에 새 커밋이 푸시되면 진행 중인 리뷰를 취소
concurrency:
    group: claude-review-${{ github.ref }}
    cancel-in-progress: true

jobs:
    claude-review:
        name: 🤖 Claude Code Review
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Run Claude Code Review
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
                  plugins: code-review@claude-plugins-official
                  # 하위 에이전트가 백그라운드로 뜨면 액션이 첫 result에서 종료해 리뷰가 누락됨
                  # https://github.com/anthropics/claude-code-action/issues/1499
                  settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
                  prompt: /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
                  claude_args: |
                      --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
                      --append-system-prompt "모든 리뷰 코멘트(인라인 코멘트와 요약 코멘트)는 한국어로 작성한다. 코드, 파일 경로, 식별자는 원문 그대로 둔다."
